name: Backend — test, publish, deploy

# The frontend has its own workflow (deploy.yml → GitHub Pages). This one owns
# the server: tests, a container image on GHCR, and the Azure App Service that
# runs it.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "server/**"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/muzix-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      - run: npm test
        working-directory: server

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      # Needs two repository secrets:
      #   AZURE_WEBAPP_NAME            the App Service name
      #   AZURE_WEBAPP_PUBLISH_PROFILE downloaded from the App Service overview
      #
      # The App Service must be a Linux "Web App for Containers" plan, and if
      # the GHCR package is private it needs DOCKER_REGISTRY_SERVER_* app
      # settings so Azure can pull it.
      #
      # Until both secrets exist the deploy is skipped with a warning instead of
      # failing. The image is already built, tested and pushed to GHCR by the
      # job above — that part is real whether or not an Azure subscription is
      # attached, and it shouldn't show up as a broken build. The secrets
      # context isn't available in a job-level `if:`, so this has to be a step.
      - name: Check for Azure credentials
        id: creds
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -n "$APP_NAME" ] && [ -n "$PUBLISH_PROFILE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Azure deploy — set AZURE_WEBAPP_NAME and AZURE_WEBAPP_PUBLISH_PROFILE to enable it. The image is on GHCR either way."
          fi

      - id: deploy
        if: steps.creds.outputs.ready == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ghcr.io/${{ github.repository_owner }}/muzix-server:${{ github.sha }}
