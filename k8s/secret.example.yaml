# Template only — do not commit a filled-in copy of this file.
#
# Create the real secret from your .env instead:
#   kubectl create secret generic muzix-secrets --from-env-file=server/.env
#
# And the registry pull secret, if the image is private:
#   kubectl create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username> \
#     --docker-password=<a PAT with read:packages>
apiVersion: v1
kind: Secret
metadata:
  name: muzix-secrets
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://user:password@cluster/muzix"
  JWT_SECRET: "a-long-random-string"
  YOUTUBE_API_KEY: "your-youtube-data-api-v3-key"
  ALLOWED_ORIGINS: "https://your-frontend-origin"
