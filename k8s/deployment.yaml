apiVersion: apps/v1
kind: Deployment
metadata:
  name: muzix-server
  labels: { app: muzix-server }
spec:
  # Deliberately one replica. Room membership, playback position, the pomodoro
  # timer and the chat backlog all live in Maps inside socket.js, so a second
  # pod would serve a different half of every room. Scaling out means moving
  # that state into Redis behind @socket.io/redis-adapter first — the replica
  # count is not the thing standing in the way.
  replicas: 1
  selector:
    matchLabels: { app: muzix-server }
  template:
    metadata:
      labels: { app: muzix-server }
    spec:
      containers:
        - name: server
          image: ghcr.io/mutcherlarahulkumar/muzix-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
          envFrom:
            - secretRef:
                name: muzix-secrets
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      imagePullSecrets:
        - name: ghcr-pull
